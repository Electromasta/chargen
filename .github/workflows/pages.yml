# Build the Angular site (northmarches.com) and publish it to GitHub Pages on every push to master.
# The custom domain is set in the repo's Settings → Pages (a CNAME file isn't used with Actions).
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The lockfile was made with legacy peer-dependency handling
      - run: npm ci --legacy-peer-deps
      # Served at https://electromasta.github.io/chargen/ for now. Once a custom domain is set in
      # Settings → Pages, change BASE_HREF to /
      - run: npx ng build --base-href "$BASE_HREF"
        env:
          BASE_HREF: /${{ github.event.repository.name }}/
      # Routes are handled in the browser: serve the app for unknown paths too, so deep links work
      - run: cp dist/chargen/browser/index.html dist/chargen/browser/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/chargen/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
